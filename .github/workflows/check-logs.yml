name: Check logs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x check-logs.sh

      - name: Run log check
        shell: bash
        run: ./check-logs.sh ./logs 2>&1 | tee check-logs-output.txt

      - name: Upload script output
        
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs-output
          path: check-logs-output.txt
          if-no-files-found: warn
